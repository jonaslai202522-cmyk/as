<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="GPEBLa2rI0WUvn6kSiRO0X"><head data-page-node-id="HjWB2Y5Yb2qIiezGiDqVBf">
<meta charset="UTF-8" data-page-node-id="JN3mH1mDeUcM1eAtG5KtvV">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="uxTbYSDYDHdDZfbHRKQuBx">
<title>淘宝任务二维码生成器</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --orange:#ff5000; --red:#c0392b; --ink:#1f2329; --sub:#6b7280; --line:#eceef1; --ok:#16a34a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); padding:40px 16px; }
  .wrap { max-width:640px; margin:0 auto; }
  .meta { color:var(--sub); font-size:13px; }

  #parseMeta { margin:2px 2px 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .label { font-size:13px; color:var(--sub); margin-bottom:8px; }
  .qr-label { font-size:15px; color:var(--red); font-weight:700; margin-bottom:10px; }
  .input-row { display:flex; gap:10px; }
  input[type=text] { flex:1; font-size:16px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; outline:none; transition:border .15s; }
  input[type=text]:focus { border-color:var(--orange); }
  .clear { border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:10px; padding:0 16px; cursor:pointer; font-size:14px; }
  .clear:hover { color:var(--orange); border-color:var(--orange); }
  .hint { font-size:12px; color:var(--sub); margin-top:8px; min-height:16px; }
  .hint.err { color:#dc2626; }
  .hint.ok { color:var(--ok); }
  .qrcard { display:none; text-align:center; }
  .qrcard.show { display:block; }
  .qr-box { display:inline-block; background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  #qr img, #qr svg { display:block; width:240px; height:240px; }
  .bb-item { text-align:center; margin-top:18px; }
  .bb-item .qr-label { text-align:center; }
  .tip { font-size:12px; color:var(--sub); margin-top:12px; }
  .btn-row { display:flex; gap:10px; margin-top:14px; }
  .btn { flex:1; border:1px solid var(--orange); color:var(--orange); background:#fff; border-radius:10px; padding:9px 0; font-size:14px; cursor:pointer; text-align:center; }
  .btn:hover { background:var(--orange); color:#fff; }
  .btn.primary { background:var(--orange); color:#fff; }
  .btn.primary:hover { filter:brightness(1.05); }
  .note { font-size:12px; color:var(--sub); line-height:1.8; }
  .shop { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .shop-divider { width:1px; align-self:stretch; background:var(--line); }
  .shop-copy-btn { flex-shrink:0; width:106px; min-height:88px; display:flex; align-items:center; justify-content:center; padding:10px 8px; border:0; border-radius:9px; background:linear-gradient(135deg,#ff5000,#ff7a29); color:#fff; font-size:12px; font-weight:700; line-height:1.45; text-align:center; font-family:inherit; cursor:pointer; }
  .shop-copy-btn:hover { filter:brightness(1.05); }
  .shop-copy-btn:active { filter:brightness(.94); }
  .shop-copy-btn.done { background:linear-gradient(135deg,#16a34a,#22c55e); }
  .shop-title { font-weight:700; font-size:15px; margin-bottom:6px; }
  .shop-addr { color:var(--red); font-weight:700; font-size:13px; line-height:1.7; flex:1; min-width:0; }
  .shop-row { display:flex; align-items:center; gap:14px; flex:1 1 100%; }
  .shop-qq-label { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .shop-qq { display:flex; flex-wrap:wrap; gap:6px; }
  .shop-qq span { background:#f3f4f6; border-radius:6px; padding:2px 8px; font-size:12px; color:#374151; }
  .marquee { position:relative; overflow:hidden; background:#fff8f0; border:1px solid #fed7aa; border-radius:10px; padding:9px 0; margin-bottom:16px; }
  .marquee::before, .marquee::after { content:''; position:absolute; top:0; bottom:0; width:26px; pointer-events:none; z-index:2; }
  .marquee::before { left:0; background:linear-gradient(90deg,#fff8f0,rgba(255,248,240,0)); }
  .marquee::after { right:0; background:linear-gradient(270deg,#fff8f0,rgba(255,248,240,0)); }
  .marquee-track { display:inline-flex; width:max-content; white-space:nowrap; will-change:transform; -webkit-animation:marquee-scroll 32s linear infinite; animation:marquee-scroll 32s linear infinite; }
  .marquee:hover .marquee-track { -webkit-animation-play-state:paused; animation-play-state:paused; }
  .marquee-item { flex:0 0 auto; padding:0 32px; font-size:13px; font-weight:600; line-height:1.4; color:#c2410c; }
  .marquee-item::after { content:'●'; margin-left:64px; font-size:8px; vertical-align:2px; color:#fdba74; }
  @-webkit-keyframes marquee-scroll { from { -webkit-transform:translateX(0); transform:translateX(0); } to { -webkit-transform:translateX(-50%); transform:translateX(-50%); } }
  @keyframes marquee-scroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  .qq-foot { text-align:center; margin-top:24px; }
  .qq-foot-title { font-size:14px; font-weight:700; margin-bottom:10px; }
  .qq-foot .shop-qq { justify-content:center; gap:8px; }
  .qq-foot .shop-qq span { font-size:13px; padding:5px 12px; border-radius:8px; }
  .modal-mask { position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:24px; z-index:999; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .modal-mask.hide { display:none; }
  .modal-box { position:relative; width:100%; max-width:340px; background:#fff; border-radius:16px; padding:26px 20px 20px; text-align:center; box-shadow:0 14px 44px rgba(0,0,0,.24); -webkit-animation:modal-in .22s ease-out both; animation:modal-in .22s ease-out both; }
  @-webkit-keyframes modal-in { from { opacity:0; -webkit-transform:translateY(14px) scale(.96); transform:translateY(14px) scale(.96); } to { opacity:1; -webkit-transform:none; transform:none; } }
  @keyframes modal-in { from { opacity:0; transform:translateY(14px) scale(.96); } to { opacity:1; transform:none; } }
  .modal-close { position:absolute; top:6px; right:8px; width:32px; height:32px; border:0; border-radius:50%; background:transparent; color:#9ca3af; font-size:22px; line-height:1; font-family:inherit; cursor:pointer; }
  .modal-close:hover { background:#f3f4f6; color:#374151; }
  .modal-tag { display:inline-block; font-size:11px; font-weight:700; color:#fff; background:linear-gradient(135deg,#e53935,#ff7043); border-radius:20px; padding:3px 12px; margin-bottom:10px; }
  .modal-title { font-size:20px; font-weight:800; color:var(--red); margin-bottom:6px; }
  .modal-sub { font-size:12px; color:var(--sub); margin-bottom:16px; }
  .modal-copy-btn { width:100%; border:0; border-radius:10px; padding:13px 0; background:linear-gradient(135deg,#ff5000,#ff7a29); color:#fff; font-family:inherit; font-size:15px; font-weight:700; line-height:1.4; cursor:pointer; }
  .modal-copy-btn:hover { filter:brightness(1.05); }
  .modal-copy-btn:active { filter:brightness(.94); }
  .modal-copy-btn.done { background:linear-gradient(135deg,#16a34a,#22c55e); }
  .share-input { width:100%; min-height:74px; font-size:14px; line-height:1.6; padding:12px 14px; border:1px solid var(--line); border-radius:10px; resize:vertical; font-family:inherit; outline:none; color:var(--ink); }
  .share-input:focus { border-color:var(--orange); }
  .tabbar { display:flex; gap:8px; margin-bottom:8px; }
  .tabbtn { flex:1; padding:11px 0; text-align:center; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-size:15px; font-weight:600; cursor:pointer; }
  .tabbtn.active { background:var(--orange); border-color:var(--orange); color:#fff; }

  /* 标签栏下面一整行三个内框：淘宝店铺 / 加QQ群 / 公众号（与秒杀、百补同一套宽度和间距对齐），内容都收在框里 */
  .entry-bar { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 16px; }
  .entry-box { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:8px; padding:10px 8px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .entry-head { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:4px 0; border:0; background:transparent; color:var(--orange); font-family:inherit; font-size:14px; font-weight:800; line-height:1.3; cursor:pointer; }
  .entry-head:active { filter:brightness(.97); }
  .entry-head .entry-arrow { font-size:10px; color:#9aa0aa; transition:transform .18s ease; }
  .entry-body { display:none; }
  .entry-box.open .entry-body { display:flex; flex-direction:column; gap:8px; }
  .entry-box.open .entry-arrow { transform:rotate(180deg); }
  .entry-btn { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; padding:0; border:0; background:transparent; color:var(--orange); font-family:inherit; font-size:13px; font-weight:700; line-height:1.35; text-align:center; cursor:pointer; }
  .entry-btn:active { filter:brightness(.97); }
  .entry-btn .entry-qr { display:block; width:72px; height:72px; border-radius:8px; border:1px solid var(--line); background:#fff; object-fit:cover; }
  .entry-btn .entry-title { font-size:13px; font-weight:700; }
  .entry-btn .entry-desc { font-size:11px; font-weight:400; color:var(--sub); }
  .entry-btn .entry-sub { font-size:10px; font-weight:400; color:#9aa0aa; }
  .entry-btn.done, .entry-btn.done .entry-sub { color:#16a34a; }


  .shop-qr-copy{ display:block; width:88px; height:88px; flex-shrink:0; border-radius:9px; overflow:hidden; border:1px solid var(--line); background:#fff; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; }
  .shop-qr-copy img{ width:100%; height:100%; object-fit:cover; display:block; }
  .shop-qr-copy:hover{ transform:scale(1.05); box-shadow:0 2px 6px rgba(24,28,36,.05), 0 10px 26px rgba(24,28,36,.07); }
  .shop-qr-copy:active{ transform:scale(.98); }
</style>

  // 固定一条「双十一超级红包」口令，不再随机
  var D11_OFFERS = [
    {
      title: '双十一超级红包',
      sub: '复制口令，打开淘宝即可领取',
      btn: '复制口令 淘宝打开',
      app: '淘宝',
      text: '07￥ HU108 mMJJTsdJtWm￥ https://m.tb.cn/h.jbMvVUJ  双11超级红包'
    }
  ];
  var mask = document.getElementById('d11Mask');
  var d11Close = document.getElementById('d11Close');
  var d11CopyBtn = document.getElementById('d11CopyBtn');
  var d11Title = document.getElementById('d11Title');
  var d11Sub = document.getElementById('d11Sub');
  if (mask){
    // 固定展示唯一一条口令
    var offer = D11_OFFERS[0];
    // 先把本次要展示的文案写进弹窗，再打开，避免出现内容闪变
    if (d11Title) d11Title.innerHTML = offer.title;
    if (d11Sub) d11Sub.innerHTML = offer.sub;
    if (d11CopyBtn) d11CopyBtn.innerHTML = offer.btn;
    // 弹窗只负责显示/隐藏，不再锁 body 滚动（锁滚动一旦没被解除，整页就拉不动了）
    var openModal = function(){
      mask.className = 'modal-mask';                 // 去掉 hide
    };
    var closeModal = function(){
      mask.className = 'modal-mask hide';
      // 兜底：清掉任何可能残留的滚动锁
      try {
        document.body.style.removeProperty('overflow');
        document.documentElement.style.removeProperty('overflow');
      } catch (e) {}
    };
    // 每次加载/刷新都弹出（不写 localStorage、不加任何记忆）
    openModal();
    if (d11Close) d11Close.addEventListener('click', closeModal);
    // 点遮罩空白处关闭（点弹窗本体不关）
    mask.addEventListener('click', function(e){ if (e.target === mask) closeModal(); });
    // ESC 关闭
    document.addEventListener('keydown', function(e){
      if ((e.key === 'Escape' || e.keyCode === 27) && mask.className.indexOf('hide') < 0) closeModal();
    });
    bindCopy(d11CopyBtn, offer.text, 'modal-copy-btn', offer.btn, offer.app);
  }

})();
</script>

<script>
// ---- 三个内框（淘宝店铺 / 加QQ群 / 公众号）：点标题展开/收起内容，内容里点一下复制 ----
(function(){
  var SHOP_CMD = '【淘宝】08🔐UG1cTIKNpWv💲 https://m.tb.cn/h.jZuh4jlVNlvQSQA HU591\n点击链接直接打开 或者 淘宝搜索直接打开';
  var QQ_NO = '672460232';
  var MP_CMD = SHOP_CMD;

  function legacyCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText && location.protocol !== 'file:'){
      return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function bind(btn, sub, text, okMsg){
    if (!btn || !sub) return;
    var orig = sub.innerHTML;
    btn.addEventListener('click', function(){
      copyText(text || '').then(function(ok){
        sub.innerHTML = ok ? okMsg : '复制失败<br>请长按手动复制';
        btn.className = 'entry-btn' + (ok ? ' done' : '');
        clearTimeout(btn._t);
        btn._t = setTimeout(function(){ sub.innerHTML = orig; btn.className = 'entry-btn'; }, 2200);
      });
    });
  }

  // 手风琴：点标题展开，同时只开一个；再点收起
  var heads = document.querySelectorAll('.entry-head');
  for (var i = 0; i < heads.length; i++){
    heads[i].addEventListener('click', function(){
      var box = this.parentNode;
      var wasOpen = box.className.indexOf('open') >= 0;
      var all = document.querySelectorAll('.entry-box');
      for (var j = 0; j < all.length; j++) all[j].className = 'entry-box';
      if (!wasOpen) box.className = 'entry-box open';
    });
  }

  bind(document.getElementById('entryShop'), document.getElementById('entryShopSub'), SHOP_CMD, '已复制 ✓ 去淘宝粘贴即可打开');
  bind(document.getElementById('entryQq'), document.getElementById('entryQqSub'), QQ_NO, '已复制 ✓ 群号 672460232');
  bind(document.getElementById('entryMp'), document.getElementById('entryMpSub'), MP_CMD, '已复制 ✓ 去淘宝粘贴即可打开');
})();
</script>

<script>
// ---- 兜底：确保页面始终可以上下滚动 ----
// 历史版本的 body 上曾被写死 overflow:hidden，导致整页拉不动；
// 这里在加载后主动清掉任何残留的滚动锁（弹窗自身也不再锁 body 滚动）。
(function () {
  function unlock() {
    try {
      document.body.style.removeProperty('overflow');
      document.documentElement.style.removeProperty('overflow');
    } catch (e) {}
  }
  unlock();
  window.addEventListener('load', unlock);
  window.addEventListener('pageshow', unlock);
})();
</script>
